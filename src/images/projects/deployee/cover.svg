<rect x="950" y="165" width="180" height="145" rx="24" class="sand"/><path d="M990 215h100v55H990z" class="line"/><text x="985" y="345" class="m" font-size="18">target A</text><rect x="950" y="385" width="180" height="145" rx="24" class="sand"/><path d="M990 435h100v55H990z" class="line"/><text x="985" y="565" class="m" font-size="18">target B</text>
