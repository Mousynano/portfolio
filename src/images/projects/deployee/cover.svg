<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Deployee server-agent deployment workflow</title><desc id="desc">A central deployment server coordinates outbound-connected agents, deployment state, visibility, and recovery.</desc>
<rect width="1200" height="675" fill="#121714"/><rect x="26" y="26" width="1148" height="623" rx="30" fill="#171d19" stroke="#454c46" stroke-width="2"/>
<style>.t{font-family:Inter,Arial,sans-serif;fill:#f2eee5}.m{font-family:ui-monospace,monospace;fill:#aaa79f}.line{fill:none;stroke:#f2eee5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#454c46;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sage{fill:none;stroke:#a8bd87;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.orange{fill:none;stroke:#ef7143;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.sand{fill:none;stroke:#d7b47a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="72" y="92" class="m" font-size="24">DEPLOYMENT STATE · VISIBILITY · RECOVERY</text>
<rect x="75" y="150" width="300" height="375" rx="30" class="orange"/><text x="145" y="210" class="t" font-size="34" font-weight="700">Deployee</text><text x="157" y="247" class="m" font-size="20">server</text>
<rect x="125" y="290" width="200" height="58" rx="13" class="thin"/><text x="165" y="327" class="m" font-size="18">deployment plan</text><rect x="125" y="370" width="200" height="58" rx="13" class="thin"/><text x="175" y="407" class="m" font-size="18">state + logs</text><rect x="125" y="450" width="200" height="58" rx="13" class="thin"/><text x="175" y="487" class="m" font-size="18">rollback / LKG</text>
<path d="M405 335H545" class="line"/><path d="m520 315 28 20-28 20" class="line"/><text x="418" y="305" class="m" font-size="16">intent</text><path d="M545 405H405" class="sage"/><path d="m430 385-28 20 28 20" class="sage"/><text x="430" y="444" class="m" font-size="16">outbound state</text>
